<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Markiva</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Google Font -->
  <link
    href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap"
    rel="stylesheet"
  />

  <!-- Font Awesome for icons -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />

  <!-- CodeMirror core + theme (material-darker) -->
  <!-- Must load these BEFORE the searchcursor addon -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.9/codemirror.min.css"
  />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.9/theme/material-darker.min.css"
  />

  <!-- Our main style -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- Title Bar -->
    <div id="titlebar">
      <div class="titlebar-left">
        <div id="app-logo">M↓</div>
        <div id="app-title">Markiva</div>
        <div id="glass-tabs"></div>
      </div>

      <!-- Window Controls -->
      <!-- Editor / Split / Preview buttons, then Min/Max/Close -->
      <div id="window-controls">
        <button
          id="btn-editor-only"
          class="view-mode-btn"
          title="Editor Only"
        >
          <i class="fas fa-file-code"></i>
        </button>
        <button
          id="btn-split-view"
          class="view-mode-btn"
          title="Split View"
        >
          <i class="fas fa-columns"></i>
        </button>
        <button
          id="btn-preview-only"
          class="view-mode-btn"
          title="Preview Only"
        >
          <i class="fas fa-eye"></i>
        </button>

        <button id="min-button" title="Minimize">&#8211;</button>
        <button id="max-button" title="Maximize/Restore">&#9744;</button>
        <button id="close-button" title="Close">&#10005;</button>
      </div>
    </div>

    <!-- Search & Replace Bar (slides from top) -->
    <div id="search-replace-bar" class="search-replace-bar hidden">
      <div class="search-replace-content">
        <label for="search-input">Find:</label>
        <input type="text" id="search-input" />
        <label for="replace-input">Replace:</label>
        <input type="text" id="replace-input" />
        <!-- Icons for the buttons -->
        <button id="search-next-btn" title="Next">
          <i class="fas fa-chevron-down"></i>
        </button>
        <button id="search-replace-btn" title="Replace">
          <i class="fas fa-exchange-alt"></i>
        </button>
        <button id="search-replace-all-btn" title="Replace All">
          <i class="fas fa-sync-alt"></i>
        </button>
        <button id="search-close-btn" title="Close">
          <i class="fas fa-times"></i>
        </button>
      </div>
    </div>

    <!-- Main Layout: Sidebar + Content -->
    <div id="main-layout">
      <!-- Sidebar -->
      <div id="sidebar">
        <!-- Top Group: File Tool Buttons -->
        <div class="sidebar-top">
          <div class="sidebar-icon file-tool-btn" id="new-file-btn" title="New File">
            <i class="fas fa-plus"></i>
          </div>
          <div class="sidebar-icon file-tool-btn" id="open-file-btn" title="Open File">
            <i class="fas fa-folder-open"></i>
          </div>
          <div class="sidebar-icon file-tool-btn" id="save-file-btn" title="Save">
            <i class="fas fa-save"></i>
          </div>
          <div class="sidebar-icon file-tool-btn" id="rename-file-btn" title="Rename">
            <i class="fas fa-edit"></i>
          </div>
          <div class="sidebar-icon file-tool-btn" id="refresh-files-btn" title="Refresh Files">
            <i class="fas fa-sync"></i>
          </div>
          <div class="sidebar-icon file-tool-btn" id="copy-preview-btn" title="Copy Preview">
            <i class="fas fa-copy"></i>
          </div>
        </div>
        <!-- Middle Group: Editor Formatting + Search -->
        <div class="sidebar-middle">
          <div class="sidebar-icon format-btn" id="btn-bold" title="Bold">
            <i class="fas fa-bold"></i>
          </div>
          <div class="sidebar-icon format-btn" id="btn-italic" title="Italic">
            <i class="fas fa-italic"></i>
          </div>
          <div class="sidebar-icon format-btn" id="btn-code" title="Code">
            <i class="fas fa-code"></i>
          </div>
          <div class="sidebar-icon format-btn" id="btn-link" title="Link">
            <i class="fas fa-link"></i>
          </div>
          <div class="sidebar-icon format-btn" id="btn-heading" title="Heading">
            <i class="fas fa-heading"></i>
          </div>
          <div class="sidebar-icon format-btn" id="btn-table" title="Table">
            <i class="fas fa-table"></i>
          </div>
          <!-- The Search button triggers our custom search bar -->
          <div class="sidebar-icon format-btn" id="btn-search" title="Search & Replace">
            <i class="fas fa-search"></i>
          </div>
        </div>
        <!-- Bottom Group: Settings and About -->
        <div class="sidebar-bottom">
          <div class="sidebar-icon" id="settings-btn" title="Settings">
            <i class="fas fa-cog"></i>
          </div>
          <div class="sidebar-icon" id="about-btn" title="About">
            <i class="fas fa-info-circle"></i>
          </div>
        </div>
      </div>

      <!-- Content Area -->
      <div id="content-area">
        <div id="split-pane">
          <!-- Editor Column -->
          <div id="editor-container">
            <div class="editor-header">
              <h3>Markiva Editor</h3>
            </div>
            <div id="editor-wrapper"></div>
            <!-- Table Editor Panel -->
            <div id="table-editor-panel">
              <h4>Table Editor</h4>
              <button id="table-add-row">Add Row</button>
              <button id="table-remove-row">Remove Row</button>
              <button id="table-add-col">Add Column</button>
              <button id="table-remove-col">Remove Column</button>
            </div>
          </div>

          <!-- Preview Column -->
          <div id="preview-container">
            <div class="preview-header">
              <div class="preview-tab active">Preview</div>
            </div>
            <div id="preview-content"></div>
          </div>

          <!-- Notes + File Browser Column -->
          <div id="notes-container">
            <div id="notes-panel">
              <!-- Notes Section -->
              <div class="notes-section">
                <div class="notes-header">
                  <h3>Notes</h3>
                </div>
                <div class="notes-editor">
                  <input type="text" id="new-note-input" placeholder="Enter a new note..." />
                  <button id="add-note-button">
                    <i class="fas fa-plus"></i>
                  </button>
                </div>
                <ul id="notes-list"></ul>
              </div>
              <!-- Draggable Splitter -->
              <div id="notes-splitter"><i class="fas fa-grip-lines"></i></div>
              <!-- File Browser Section -->
              <div class="file-browser-section">
                <div id="file-browser-header">
                  <h4>Project Files</h4>
                  <input type="text" id="file-search" placeholder="Search files..." />
                </div>
                <ul id="file-list"></ul>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Status Bar -->
    <div id="status-bar">
      <span id="version-status">V3</span>
      <div id="status-info">
        <span id="word-count">Words: 0</span>
        <span id="read-time">Read Time: 0 min</span>
      </div>
    </div>

    <!-- Custom Prompt Modal -->
    <div id="custom-prompt" class="custom-prompt">
      <div class="prompt-content">
        <div class="prompt-message"></div>
        <input type="text" id="prompt-input" />
        <div class="prompt-buttons">
          <button id="prompt-ok">OK</button>
          <button id="prompt-cancel">Cancel</button>
        </div>
      </div>
    </div>

    <!-- Link Dialog -->
    <div id="link-dialog" class="custom-prompt">
      <div class="prompt-content">
        <h2>Add Link</h2>
        <label>Link Text:</label>
        <input type="text" id="link-text" />
        <label>Link URL:</label>
        <input type="text" id="link-url" value="https://" />
        <div class="prompt-buttons">
          <button id="link-ok">OK</button>
          <button id="link-cancel">Cancel</button>
        </div>
      </div>
    </div>

    <!-- Table Dialog -->
    <div id="table-dialog" class="custom-prompt">
      <div class="prompt-content">
        <h2>Insert Table</h2>
        <label>Rows:</label>
        <input type="number" id="table-rows" value="3" min="1" />
        <label>Columns:</label>
        <input type="number" id="table-cols" value="3" min="1" />
        <div>
          <input type="checkbox" id="table-header" checked />
          <label for="table-header">Include Header Row</label>
        </div>
        <div class="prompt-buttons">
          <button id="table-ok">OK</button>
          <button id="table-cancel">Cancel</button>
        </div>
      </div>
    </div>

    <!-- Save Changes Dialog (3-button) -->
    <div id="save-changes-dialog" class="custom-prompt">
      <div class="prompt-content">
        <div class="prompt-message">
          <p id="save-changes-filename" style="font-weight: bold;"></p>
          <p>Do you want to save your changes before closing?</p>
        </div>
        <div class="prompt-buttons">
          <button id="save-changes-save-btn">Save</button>
          <button id="save-changes-dontsave-btn">Don't Save</button>
          <button id="save-changes-cancel-btn">Cancel</button>
        </div>
      </div>
    </div>

    <!-- Context Menu for Project Files -->
    <div id="file-context-menu" class="context-menu">
      <ul>
        <li data-action="open">Open</li>
        <li data-action="rename">Rename</li>
        <li data-action="delete">Delete</li>
      </ul>
    </div>
  </div>

  <!-- Scripts: Load CodeMirror first, then searchcursor, then our code -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.9/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.9/mode/markdown/markdown.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.9/addon/edit/continuelist.min.js"></script>
  <!-- Must load AFTER codemirror is defined -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.9/addon/search/searchcursor.min.js"></script>

  <!-- Our main app logic (with custom search, context menu, load last file) -->
  <script src="renderer.js"></script>
</body>
</html>
