<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Splash</title>
  <!-- If you have a splash.css in the same folder, reference it here. -->
  <link rel="stylesheet" href="splash.css" />
</head>
<body>
  <!-- starfield backgrounds from your splash.css -->
  <div class="starfield starfield-layer1"></div>
  <div class="starfield starfield-layer2"></div>

  <div id="splash-container">
    <!-- 
      CRITICAL: 
      "assets/MarkivaLogo.png" => no leading "./", so it's from the same directory 
      that "splash.html" is in, plus an "assets" subfolder 
    -->
    <img
      src="assets/MarkivaLogo.png"
      id="logo-image"
      alt="Markiva Logo"
      onerror="console.error('[DEBUG] MarkivaLogo.png failed to load from', this.src)"
    />
    <div id="loading-text">Loading…</div>
    <div id="progress-bar">
      <div id="progress-fill"></div>
    </div>
  </div>

  <div id="splash-left">Developed by Robin Doak</div>
  <div id="splash-right">V3.1</div>

  <script src="splash.js"></script>
  <script>
    console.log("[DEBUG] splash.html loaded. #logo-image is:", document.getElementById("logo-image"));
  </script>
</body>
</html>
